services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookworm
      POSTGRES_PASSWORD: bookworm
      POSTGRES_DB: bookworm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookworm -d bookworm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://bookworm:bookworm@db:5432/bookworm_db
      JWT_SECRET: bookworm-dev-secret-change-in-production
      JWT_EXPIRES_IN: 24h
      PORT: 3001
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
